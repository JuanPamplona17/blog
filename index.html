<!DOCTYPE html>
<html lang="es">

<head>

<body>
  <header class="header">
    <div class="container header__inner">
      <a href="/" class="logo">Mi Blog</a>

      <nav class="nav" aria-label="Navegación principal">
        <ul class="nav__list">
          <li><a href="/" class="nav__link nav__link--active">Inicio</a></li>
          <li><a href="#about" class="nav__link nav__link--active">Acerca de</a></li>
          <li><a href="#blog" class="nav__link nav__link--active">Blog</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <button class="theme-toggle" data-theme-toggle aria-label="Cambiar tema">
          <svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <path 40 d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0-8 0m-5 0h1m8-9v1m8 8h1m-9 8v1M5.6 5.6l.7.7m12.1-.7l-.7.7m0 11.4
     l.7.7m-12.1-.7l-.7.7" />
          </svg>
        </button>
        <button class="theme-toggle mobile-menu-btn hidden" data-mobile-menu aria-label="Menú móvil">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12h18M3 6h18M3 18h18" />
          </svg>
        </button>
      </div>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="container">
        <h1 class="hero__title">Bienvenido a mi Blog</h1>
        <p class="hero__subtitle">Comparto mis pensamientos sobre desarrollo web, programación y tecnología. Espero que
          algo de lo que escribo te sea útil.</p>
      </div>
    </section>
    <section id="blog" class="posts">
      <div class="container">
        <h2 class="posts__title">Últimos Posts</h2>
        <div class="grid" data-posts-container></div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="container">
